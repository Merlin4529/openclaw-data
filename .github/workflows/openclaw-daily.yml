name: OpenClaw Daily Pipeline

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v3
      
      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: "📦 Instalar dependencias"
        run: |
          pip install requests pandas numpy
      
      - name: "🔄 Regenerar manifest"
        run: |
          python3 scripts/build_manifest.py || echo "⚠ build_manifest.py no encontrado"
      
      - name: "🎯 HARPO v3.0"
        run: |
          python3 scripts/harpo_v3_modulator.py || echo "⚠ harpo_v3_modulator.py no encontrado"
      
      - name: "🤖 D2 Autonomy"
        run: |
          python3 scripts/d2_autonomy_protocol.py || echo "⚠ d2_autonomy_protocol.py no encontrado"
      
      - name: "💰 JOKER Logic"
        run: |
          python3 scripts/joker_selection_logic.py || echo "⚠ joker_selection_logic.py no encontrado"
      
      - name: "✅ Completado"
        run: echo "Pipeline ejecutado exitosamente"
